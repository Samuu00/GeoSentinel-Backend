# Configurazione di Dependabot: ogni settimana controlla se ci sono versioni nuove delle dipendenze e apre
# delle pull request per aggiornarle.

version: 2
updates:
  # Dipendenze Maven del pom.xml. Gli aggiornamenti minor e patch arrivano raggruppati in un'unica PR; le
  # major arrivano separate, perché possono rompere la compatibilità e vanno lette con attenzione.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  # Immagini di base del Dockerfile (eclipse-temurin).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Immagini usate nei file di Docker Compose (postgis, redis, pgsty/minio, pgsty/mc e le altre).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Versioni delle GitHub Actions usate nei workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
