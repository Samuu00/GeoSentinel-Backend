# Build + unit test (surefire) + integration test *IT (failsafe, Testcontainers: i runner ubuntu hanno Docker)
# e build dell'immagine Docker, a ogni push su main e su ogni pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Il token del workflow può solo leggere il codice
permissions:
  contents: read

# Un nuovo push sulla stessa PR/branch annulla la run precedente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # mvnw è versionato senza bit di esecuzione (100644)
      - run: chmod +x mvnw
      - run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Solo build (M0.4): nessun push su un registry
      - run: docker build -t geosentinel-backend:ci .

  # Secret scanning (M0.5): sui repo privati di un account personale GitHub non lo offre.
  # Scansiona tutta la storia a ogni push/PR e fallisce se trova chiavi, password o token
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Binario a versione fissa con checksum verificato (Dependabot non aggiorna questa riga: va fatto a mano)
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
