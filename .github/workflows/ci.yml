# Workflow di integrazione continua di GitHub Actions, eseguito a ogni push su main e su ogni pull request.
# Comprende tre job indipendenti: compilazione con test unitari (surefire) e test di integrazione *IT
# (failsafe con Testcontainers, possibile perché i runner Ubuntu hanno Docker), build dell'immagine Docker
# e ricerca di segreti finiti per errore nella storia del repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Il token del workflow ha solo il permesso di leggere il codice.
permissions:
  contents: read

# Un nuovo push sullo stesso branch o sulla stessa PR annulla l'esecuzione precedente ancora in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compilazione e test con il Maven wrapper e JDK 21; la cache di Maven accelera le esecuzioni successive.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # mvnw è salvato nel repository senza il permesso di esecuzione, quindi va aggiunto qui.
      - run: chmod +x mvnw
      - run: ./mvnw -B verify

  # Verifica che il Dockerfile produca un'immagine valida. È solo una build: l'immagine non viene
  # pubblicata su nessun registry.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t geosentinel-backend:ci .

  # Ricerca di segreti con gitleaks, perché il secret scanning di GitHub non è disponibile su tutti i
  # repository. Scansiona l'intera storia (fetch-depth 0) e fallisce se trova chiavi, password o token.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks si scarica come binario a versione fissa e se ne verifica il checksum SHA-256 prima di
      # usarlo. Dependabot non aggiorna questo passaggio: versione e checksum vanno cambiati a mano, insieme.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
