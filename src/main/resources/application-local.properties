# Credenziali e segreti arrivano dal .env

# Flyway: migrazioni + seed di sviluppo (utenti per ruolo, sentieri, rifugio, squadre)
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Docs accese solo qui (spente nel file base)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Logging SQL solo in sviluppo
spring.jpa.properties.hibernate.format_sql=true
logging.level.it.unical.geosentinel=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# Valori dei parametri delle query (Hibernate 6+): stampa anche password_hash e note mediche, attivare solo se serve
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
