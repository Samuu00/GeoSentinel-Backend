# Profilo local, per lo sviluppo sul proprio computer: contiene solo le differenze dal file base.
# Credenziali e segreti arrivano dal file .env.

# Flyway applica le migrazioni e, solo in questo profilo, anche i dati di prova (un utente per ruolo,
# sentieri, rifugi, squadre di soccorso).
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Documentazione OpenAPI e Swagger UI accese solo qui (nel file base sono spente), con operazioni e
# gruppi ordinati alfabeticamente.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Log più dettagliati, comprese le query SQL generate da Hibernate, solo in sviluppo.
spring.jpa.properties.hibernate.format_sql=true
logging.level.it.unical.geosentinel=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# La riga seguente stampa anche i valori dei parametri delle query, quindi anche hash delle password e note
# mediche: va attivata togliendo il cancelletto solo quando serve davvero.
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Invio delle email acceso: il server SMTP si configura nel .env con le variabili MAIL_* (si veda .env.example).
geosentinel.mail.enabled=true
