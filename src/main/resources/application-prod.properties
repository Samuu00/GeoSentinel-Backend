# Profilo prod/staging: solo le differenze dal file base. Segreti e indirizzi dalle variabili d'ambiente
# del server (docker-compose.prod.yml), mai da file nel repository.

# Dietro Caddy (TLS): Tomcat legge X-Forwarded-For/-Proto solo se la richiesta arriva da un proxy interno
# (reti private e loopback, server.tomcat.remoteip.internal-proxies). Senza, tutti i client avrebbero l'IP
# del proxy e il rate limit per IP li bloccherebbe insieme; gli URL generati (Location) sarebbero http
server.forward-headers-strategy=native

# Documentazione spenta anche se un altro file la accende
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=INFO
logging.level.it.unical.geosentinel=INFO
