spring.application.name=GeoSentinel

# DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/trail_db
spring.datasource.username=postgres
spring.datasource.password=password

# JPA & Hibernate Spatial
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgresql.PostgresSpatialDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
