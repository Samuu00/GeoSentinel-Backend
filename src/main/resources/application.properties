spring.application.name=GeoSentinel

# Carica il .env locale
spring.config.import=optional:file:.env[.properties]

# DataSource: POSTGRES_DB è il NOME del database (lo legge anche l'immagine Postgres), non un URL JDBC.
# DB_HOST/DB_PORT hanno un default per l'app avviata dall'IDE; nel compose si passa DB_HOST=postgres.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# statement_timeout: nessuna query (es. un generate_series enorme) tiene a lungo connessione e lock
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'; SET statement_timeout = '30s'

# JPA & Hibernate Spatial (dialect rilevato in automatico, basta hibernate-spatial sul classpath)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Migrations
spring.flyway.locations=classpath:db/migration

# Redis (blacklist JWT, rate limit, cache). Nel compose: --requirepass ${REDIS_PASSWORD}, REDIS_HOST=redis.
# Password vuota di default (Redis locale senza password). Se Redis è protetto e manca REDIS_PASSWORD,
# falliscono login, blacklist e rate limit di /auth (sono fail-closed)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# JWT (il segreto sta in .env: almeno 32 byte, altrimenti l'avvio fallisce)
geosentinel.jwt.secret=${JWT_SECRET}
geosentinel.jwt.access-ttl=15m
geosentinel.jwt.refresh-ttl=7d
# Durata massima della sessione (famiglia di refresh token): oltre serve un nuovo login
geosentinel.jwt.session-max-ttl=30d
# Periodo di grazia del refresh token appena ruotato, se il successore non è mai stato usato (ADR-0019)
geosentinel.jwt.refresh-reuse-grace=60s
geosentinel.jwt.issuer=https://geosentinel.dev

# Rate limit per minuto (RateLimitFilter). Per IP sotto il CGNAT degli operatori molti telefoni condividono
# lo stesso indirizzo: il brute force sul login lo ferma il limite per account (10 tentativi ogni 15 minuti)
geosentinel.rate-limit.login-per-minute=30
geosentinel.rate-limit.refresh-per-minute=120
geosentinel.rate-limit.general-per-minute=60

# Età minima per registrarsi (GDPR art. 8): 14 in Italia (art. 2-quinquies Codice privacy), 13-16 negli altri Stati UE
geosentinel.registration.min-age=14

# MinIO: stesse chiavi MINIO_ROOT_* lette dall'immagine MinIO. endpoint = raggiunto dall'app,
# public-endpoint = usato per firmare gli URL che riceve il client (nel compose: MINIO_ENDPOINT=http://minio:9000)
geosentinel.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
geosentinel.storage.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
geosentinel.storage.minio.access-key=${MINIO_ROOT_USER}
geosentinel.storage.minio.secret-key=${MINIO_ROOT_PASSWORD}
geosentinel.storage.minio.bucket=${MINIO_BUCKET:geosentinel-media}

# Push FCM. Spente di default (local, test, CI: le push finiscono nel log). Per accenderle:
# PUSH_ENABLED=true e GOOGLE_APPLICATION_CREDENTIALS = percorso del JSON dell'account di servizio Firebase (mai nel repo)
geosentinel.push.enabled=${PUSH_ENABLED:false}
geosentinel.push.credentials-file=${GOOGLE_APPLICATION_CREDENTIALS:}

# Errori come Problem Details RFC 7807
spring.mvc.problemdetails.enabled=true

# Paginazione: tetto alla dimensione di pagina richiedibile dal client
spring.data.web.pageable.max-page-size=100

# Il bean sosNotificationExecutor farebbe sparire l'applicationTaskExecutor di Boot:
# ogni altro @Async senza nome finirebbe sul pool riservato agli SOS
spring.task.execution.mode=force

# Compressione gzip delle risposte JSON (risparmia dati mobili). Sotto 1 KB non conviene
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
server.compression.min-response-size=1KB

# Le richieste in corso finiscono prima dello stop del container
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator: solo health, senza dettagli (l'endpoint è pubblico)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Docs attive solo nel profilo local
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Reset della password: codice valido 15 minuti, consumato dopo 5 errori
geosentinel.password-reset.ttl=15m
geosentinel.password-reset.max-attempts=5

# Email: spenta di default (LoggingPasswordResetMailer). Valori nel .env (vedi .env.example)
geosentinel.mail.enabled=${MAIL_ENABLED:false}
geosentinel.mail.from=${MAIL_FROM:no-reply@geosentinel.dev}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
# Server SMTP veri (es. Gmail su 587): autenticazione e STARTTLS obbligatorio, così le credenziali non viaggiano mai in
# chiaro (con il solo "enable" un intermediario potrebbe togliere il TLS). Spenti di default: Mailpit non li usa.
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
# Senza timeout JavaMail aspetta per sempre: un SMTP bloccato terrebbe occupati i thread dell'executor
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Un SMTP giù non rende giù l'app (health 503 → proxy e compose la darebbero morta, SOS compresi)
management.health.mail.enabled=false

# Login con Google: solo client ID pubblici, nessun segreto. Vuoto = ogni token Google viene rifiutato
geosentinel.google.client-ids=${GOOGLE_CLIENT_IDS:}
geosentinel.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
