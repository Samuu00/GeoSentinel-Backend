spring.application.name=GeoSentinel

# Loads the local .env (gitignored); optional so CI/containers can rely on real env vars
spring.config.import=optional:file:.env[.properties]

# DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE}
spring.datasource.username=${SPRING_DATASOURCE_USER}
spring.datasource.password=${SPRING_DATASOURCE_PASSW}
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'

# JPA & Hibernate Spatial (dialect auto-detected, hibernate-spatial on classpath is enough)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Errors as RFC 7807 Problem Details
spring.mvc.problemdetails.enabled=true
