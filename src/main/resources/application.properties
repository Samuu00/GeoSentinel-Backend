# Configurazione di base del backend, valida in tutti i profili.
# Il profilo local aggiunge solo le differenze nel file application-local.properties.
# Segreti e indirizzi non sono scritti qui: arrivano dalle variabili d'ambiente o dal file .env, con la
# sintassi ${NOME:valore di default}.

spring.application.name=GeoSentinel

# Importa il file .env della cartella di lavoro, se c'è, come se fosse un file di properties.
# Così l'app avviata dall'IDE legge gli stessi valori usati da Docker Compose.
spring.config.import=optional:file:.env[.properties]

# Connessione a PostgreSQL. POSTGRES_DB è il nome del database (lo legge anche l'immagine di Postgres),
# non un URL JDBC. DB_HOST e DB_PORT hanno un valore di default per l'app avviata dall'IDE; nel compose
# DB_HOST vale postgres, il nome del servizio.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Limiti impostati su ogni connessione del pool: un lock si aspetta al massimo 3 secondi e una query dura
# al massimo 30 secondi, così nessuna richiesta (per esempio una generate_series enorme) può tenere occupati
# a lungo una connessione e i suoi lock.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'; SET statement_timeout = '30s'

# JPA e Hibernate Spatial. Il dialetto di PostGIS viene riconosciuto da solo, basta hibernate-spatial nel
# classpath. Lo schema lo crea Flyway: Hibernate si limita a verificare che le entità corrispondano alle
# tabelle (validate). open-in-view è spento, quindi le associazioni lazy vanno caricate dentro i servizi.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Cartella delle migrazioni Flyway. Nel profilo local si aggiungono anche i dati di prova.
spring.flyway.locations=classpath:db/migration

# Redis, usato per la blacklist dei JWT, il rate limit e le cache. Nel compose Redis parte con
# --requirepass e REDIS_HOST vale redis. Di default la password è vuota (Redis locale senza password): se
# Redis è protetto e REDIS_PASSWORD manca, login, blacklist e rate limit di /auth falliscono, perché in
# caso di errore questi controlli negano l'accesso invece di lasciarlo passare.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# Token JWT. Il segreto sta nel .env e deve essere lungo almeno 32 byte, altrimenti l'avvio fallisce.
# access-ttl e refresh-ttl sono le durate dell'access token e del refresh token.
geosentinel.jwt.secret=${JWT_SECRET}
geosentinel.jwt.access-ttl=15m
geosentinel.jwt.refresh-ttl=7d
# Durata massima di una sessione, cioè di una catena di refresh token ruotati: superata questa durata
# serve un nuovo login.
geosentinel.jwt.session-max-ttl=30d
# Periodo di grazia di un refresh token appena sostituito: se il client lo ripresenta entro questo tempo
# e il nuovo token non è ancora stato usato (per esempio perché la risposta si è persa), la richiesta non
# viene trattata come un furto del token.
geosentinel.jwt.refresh-reuse-grace=60s
geosentinel.jwt.issuer=https://geosentinel.dev

# Rate limit in richieste al minuto, applicato da RateLimitFilter. Il limite è per indirizzo IP, ma
# dietro il CGNAT degli operatori mobili molti telefoni condividono lo stesso indirizzo, quindi i valori non
# possono essere troppo bassi: i tentativi di forza bruta sulla password li ferma il limite per account
# (10 tentativi ogni 15 minuti).
geosentinel.rate-limit.login-per-minute=30
geosentinel.rate-limit.refresh-per-minute=120
geosentinel.rate-limit.general-per-minute=60

# Età minima per registrarsi (GDPR, art. 8): in Italia è 14 anni (art. 2-quinquies del Codice privacy),
# negli altri Stati dell'Unione varia tra 13 e 16.
geosentinel.registration.min-age=14

# Object storage MinIO per le foto. Le chiavi sono le stesse MINIO_ROOT_* lette dall'immagine di MinIO.
# endpoint è l'indirizzo con cui il backend raggiunge MinIO (nel compose http://minio:9000); public-endpoint
# è quello usato per firmare gli URL consegnati all'app, che deve poterli raggiungere dall'esterno.
geosentinel.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
geosentinel.storage.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
geosentinel.storage.minio.access-key=${MINIO_ROOT_USER}
geosentinel.storage.minio.secret-key=${MINIO_ROOT_PASSWORD}
geosentinel.storage.minio.bucket=${MINIO_BUCKET:geosentinel-media}

# Notifiche push con Firebase Cloud Messaging, spente di default: in locale, nei test e in CI le push
# finiscono solo nel log. Per accenderle servono PUSH_ENABLED=true e GOOGLE_APPLICATION_CREDENTIALS con il
# percorso del JSON dell'account di servizio di Firebase, che non va mai messo nel repository.
geosentinel.push.enabled=${PUSH_ENABLED:false}
geosentinel.push.credentials-file=${GOOGLE_APPLICATION_CREDENTIALS:}

# Gli errori vengono restituiti nel formato Problem Details (RFC 7807).
spring.mvc.problemdetails.enabled=true
# Un numero con decimali in un campo intero (35.99 in pricePerNightCents) va rifiutato con 400, non troncato in
# silenzio a 35: gli importi sono centesimi interi (M10) e lo stesso vale per ospiti, posti letto e quota.
spring.jackson.deserialization.accept-float-as-int=false

# Dimensione massima di una pagina che il client può chiedere.
spring.data.web.pageable.max-page-size=100

# Definire il bean sosNotificationExecutor farebbe sparire l'executor predefinito di Spring Boot, e ogni
# altro metodo @Async senza nome finirebbe sul pool riservato agli SOS. Con force l'executor predefinito
# viene creato comunque.
spring.task.execution.mode=force

# Compressione gzip delle risposte JSON, per risparmiare traffico dati sul telefono. Sotto 1 KB il guadagno
# non vale il costo della compressione.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
server.compression.min-response-size=1KB

# Allo stop del container le richieste in corso vengono completate, aspettando al massimo 20 secondi.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator espone solo l'endpoint health, senza dettagli, perché è raggiungibile senza autenticazione.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Documentazione OpenAPI e Swagger UI spente: si accendono solo nel profilo local.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Reset della password: il codice inviato per email vale 15 minuti e viene invalidato dopo 5 tentativi
# sbagliati.
geosentinel.password-reset.ttl=15m
geosentinel.password-reset.max-attempts=5

# Invio delle email, spento di default: al suo posto LoggingPasswordResetMailer scrive solo un log.
# I valori veri stanno nel .env (si veda .env.example).
geosentinel.mail.enabled=${MAIL_ENABLED:false}
geosentinel.mail.from=${MAIL_FROM:no-reply@geosentinel.dev}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
# Per i server SMTP reali (per esempio Gmail sulla porta 587) servono autenticazione e STARTTLS
# obbligatorio, così le credenziali non viaggiano mai in chiaro: con il solo "enable" un intermediario
# potrebbe togliere il TLS. Spenti di default.
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
# Timeout di JavaMail in millisecondi. Senza, JavaMail aspetterebbe per sempre e un server SMTP bloccato
# terrebbe occupati i thread dell'executor delle email.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Lo stato del server SMTP non entra nell'health check: se fosse giù, l'health risponderebbe 503 e proxy e
# compose considererebbero morta l'intera applicazione, SOS compresi.
management.health.mail.enabled=false

# Indirizzo del motore GraphHopper che calcola i percorsi da un punto a un altro sui sentieri. Nel compose
# vale http://graphhopper:8989.
geosentinel.routing.url=${ROUTING_URL:http://localhost:8989}

# Login con Google: elenco dei client ID dell'app, che sono pubblici (nessun segreto). Se è vuoto, ogni
# token Google viene rifiutato. jwk-set-uri è l'indirizzo delle chiavi pubbliche con cui Google firma i token.
geosentinel.google.client-ids=${GOOGLE_CLIENT_IDS:}
geosentinel.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# Chiave con cui vengono cifrati nel database i segreti della verifica in due passaggi; arriva dal .env.
geosentinel.mfa.encryption-key=${MFA_ENCRYPTION_KEY}