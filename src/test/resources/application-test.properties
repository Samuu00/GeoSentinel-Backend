# Profilo test (AbstractIntegrationTest). Datasource e Redis arrivano dai container (@DynamicPropertySource).
# Valori finti ma validi: in CI non c'è il .env, e in locale il .env (importato dal file base) non deve
# finire nei test. Senza queste righe, in CI l'avvio fallisce sui placeholder ${JWT_SECRET}, ${MINIO_ROOT_*}

# Almeno 32 byte (JwtProperties)
geosentinel.jwt.secret=test-secret-for-integration-tests-only-0123456789

# Il Redis del container non ha password: vuota anche se il .env locale ha REDIS_PASSWORD
spring.data.redis.password=

# OpenApiContractIT: /v3/api-docs è spento nel profilo base; chiavi ordinate per uno snapshot stabile
springdoc.api-docs.enabled=true
springdoc.writer-with-order-by-keys=true

# Job @Scheduled spenti (SchedulingConfig): i test li chiamano direttamente, quando servono
geosentinel.scheduling.enabled=false

# MinioObjectStorage non contatta MinIO all'avvio: bastano chiavi qualsiasi
geosentinel.storage.minio.access-key=test-access-key
geosentinel.storage.minio.secret-key=test-secret-key
