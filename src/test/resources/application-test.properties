# Configurazione del profilo "test", attivato dai test di integrazione tramite AbstractIntegrationTest.
# Datasource e Redis non sono qui: li forniscono i container di Testcontainers con @DynamicPropertySource.
# I valori sotto sono finti ma validi. Servono perché in CI non esiste il file .env e in locale il .env,
# importato dalla configurazione base, non deve influenzare i test: senza queste righe l'avvio fallirebbe
# sui segnaposto non risolti come JWT_SECRET e MINIO_ROOT_USER.

# Segreto per firmare i JWT di test: JwtProperties richiede almeno 32 byte.
geosentinel.jwt.secret=test-secret-for-integration-tests-only-0123456789

# Il Redis del container non ha password, quindi la si lascia vuota anche se il .env locale ne definisce una.
spring.data.redis.password=

# Documentazione OpenAPI accesa solo nei test (nel profilo base è spenta), con le chiavi ordinate
# perché OpenApiContractIT confronta il documento con uno snapshot e serve un output stabile.
springdoc.api-docs.enabled=true
springdoc.writer-with-order-by-keys=true

# Job @Scheduled disattivati (vedi SchedulingConfig): i test che ne hanno bisogno li invocano direttamente.
geosentinel.scheduling.enabled=false

# Credenziali di MinIO qualsiasi: MinioObjectStorage non si collega a MinIO all'avvio dell'applicazione.
geosentinel.storage.minio.access-key=test-access-key
geosentinel.storage.minio.secret-key=test-secret-key

# Notifiche push sempre disattivate (si usa LoggingPushNotifier), anche se il .env locale le abilita.
geosentinel.push.enabled=false

# Chiave AES per cifrare i segreti MFA: 32 byte a zero in base64. Ha entropia bassa di proposito,
# così lo scanner dei segreti (gitleaks) non la scambia per una chiave reale.
geosentinel.mfa.encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
