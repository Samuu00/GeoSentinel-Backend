# Infrastruttura per lo sviluppo in locale con Docker Compose.
# Di solito il backend gira dall'IDE e "docker compose up -d" avvia solo i servizi di cui ha bisogno:
# PostgreSQL con PostGIS, Redis, MinIO e GraphHopper. Per avviare anche il backend in un container si usa
# "docker compose --profile app up -d --build".
# Le credenziali arrivano solo dal file .env (si veda .env.example): non ci sono valori di default, e se
# una chiave manca la sintassi ${NOME:?messaggio} ferma il compose con un errore chiaro.

services:
  # PostgreSQL con l'estensione PostGIS, il database principale del backend.
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: geosentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB mancante nel .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER mancante nel .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mancante nel .env}
    ports:
      # Porta pubblicata solo su localhost, perché il database non va esposto sulla rete. È la stessa
      # DB_PORT che usa il backend avviato dall'IDE.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Il doppio dollaro fa leggere le variabili dentro il container, invece di farle sostituire dal compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - geosentinel-net

  # Redis: blacklist dei JWT, rate limit e cache.
  redis:
    image: redis:7.2-alpine
    container_name: geosentinel-redis
    restart: unless-stopped
    # Redis richiede una password, che il backend invia sempre (spring.data.redis.password). --save salva i
    # dati su disco ogni 60 secondi se c'è stata almeno una modifica.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD mancante nel .env}",
              "--save", "60", "1", "--loglevel", "warning"]
    environment:
      # redis-cli legge la password da questa variabile nell'healthcheck, così non compare fra gli argomenti
      # del processo.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # redis-cli esce con codice 0 anche quando l'autenticazione fallisce (NOAUTH), quindi si controlla che
      # la risposta sia davvero PONG.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - geosentinel-net

  # MinIO, l'object storage compatibile con S3 in cui si salvano le foto. Le immagini ufficiali
  # (minio/minio, quay.io/minio) non sono più scaricabili, quindi si usa il fork della comunità pgsty, con
  # un tag di release fisso e mai "latest".
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: geosentinel-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER mancante nel .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD mancante nel .env}
    ports:
      # L'API è pubblicata su tutte le interfacce perché gli URL firmati li usa anche un telefono sulla
      # stessa rete (MINIO_PUBLIC_ENDPOINT è l'IP del PC). La console web resta solo su localhost.
      - "9000:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - geosentinel-net

  # Container di inizializzazione: crea il bucket privato (i file si leggono solo con URL firmati), imposta
  # la regola di scadenza e poi termina.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: geosentinel-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-geosentinel-media}
    # Con set -e il primo errore fa uscire lo script con un codice diverso da 0, e il backend, che aspetta
    # la fine corretta di questo container, non parte con un bucket mancante.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        # I caricamenti provvisori sotto staging/ (quelli mai confermati dall'app) si cancellano dopo un
        # giorno. L'import sostituisce le regole esistenti, quindi rilanciarlo non crea doppioni.
        echo '{"Rules":[{"ID":"staging-expiry","Status":"Enabled","Filter":{"Prefix":"staging/"},"Expiration":{"Days":1}}]}' | mc ilm import "local/$$MINIO_BUCKET"
    networks:
      - geosentinel-net

  # GraphHopper, il motore che calcola i percorsi a piedi da un punto a un altro sull'estratto OpenStreetMap
  # della Calabria. L'estratto si prepara con tools/routing/build_extract.sh; il grafo viene costruito al
  # primo avvio (un paio di minuti) e salvato nel volume.
  graphhopper:
    image: israelhikingmap/graphhopper:10.2
    container_name: geosentinel-graphhopper
    restart: unless-stopped
    command: ["--input", "/osm/calabria.osm.pbf", "--config", "/config/config.yml"]
    environment:
      JAVA_OPTS: "-Xmx1g -Xms512m"
    volumes:
      - ./tools/routing/.cache:/osm:ro
      - ./tools/routing/config.yml:/config/config.yml:ro
      - graphhopper_data:/graph
    ports:
      # Porta pubblicata su localhost solo per il backend avviato dall'IDE. I percorsi partono dalle
      # posizioni degli utenti, quindi il servizio non va esposto sulla rete.
      - "127.0.0.1:8989:8989"
    healthcheck:
      # L'immagine non ha curl: si controlla solo che la porta accetti connessioni. start_period lascia il
      # tempo di costruire il grafo al primo avvio.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8989"]
      interval: 10s
      timeout: 3s
      start_period: 300s
      retries: 10
    networks:
      - geosentinel-net

  # Backend in container, facoltativo: parte solo con il profilo "app".
  backend:
    build: .
    image: geosentinel-backend:dev
    container_name: geosentinel-backend
    profiles: ["app"]
    restart: unless-stopped
    # Le stesse chiavi che il backend legge dal .env quando gira dall'IDE.
    env_file: .env
    environment:
      # Profilo local: dati di prova e Swagger UI.
      SPRING_PROFILES_ACTIVE: local
      # Dentro il container "localhost" è il container stesso: gli altri servizi si raggiungono per nome.
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      ROUTING_URL: http://graphhopper:8989
      # Il JSON di Firebase non entra nell'immagine: viene montato in sola lettura dal percorso indicato nel .env.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      # Il percorso è relativo alla cartella del progetto, come quando il backend gira dall'IDE. Con le push
      # spente la variabile può mancare: in quel caso si monta un file innocuo che nessuno legge.
      - ./${GOOGLE_APPLICATION_CREDENTIALS:-.env.example}:/run/secrets/firebase.json:ro
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - geosentinel-net

# Volumi con nome fisso, così i dati sopravvivono alla ricreazione dei container.
volumes:
  postgres_data:
    name: geosentinel_postgres_data
  redis_data:
    name: geosentinel_redis_data
  minio_data:
    name: geosentinel_minio_data
  graphhopper_data:
    name: geosentinel_graphhopper_data

# Rete privata condivisa da tutti i servizi.
networks:
  geosentinel-net:
    name: geosentinel-network
